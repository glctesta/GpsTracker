<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <meta name="description" content="GPS Race Tracker">
    <title>GPS Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/google/material-design-icons/master/png/maps/my_location/materialicons/24dp/2x/baseline_my_location_black_24dp.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="map"></div>

    <aside id="sidebar" class="menu-closed">
        <header>
            <h1>Race Tracker</h1>
            <button id="menu-toggle-btn" class="icon-btn" aria-label="Toggle menu">
                &#8942; <!-- 3 vertical dots -->
            </button>
        </header>

        <div id="menu-content">

        <section id="menu">
            <h3>Menu</h3>
            <label for="gpx-file">Load GPX:</label>
            <input type="file" id="gpx-file" accept=".gpx">
        </section>

        <section id="config">
            <div class="collapsible-header">
                <h3>Options (mt)</h3>
            </div>
            <div class="collapsible-content">
                <label for="dist-a">Farest (Red):</label>
                <input type="number" id="dist-a" value="1500">

                <label for="dist-b">Middle (Yellow):</label>
                <input type="number" id="dist-b" value="500">

                <label for="dist-c">Target (Green):</label>
                <input type="number" id="dist-c" value="70">
            </div>
        </section>

        <section id="stats">
            <h3>Status</h3>
            <div>Loaded: <strong id="wp-total">0</strong></div>
            <div>Achieved: <strong id="wp-reached">0</strong></div>
            <div>To achieve: <strong id="wp-remaining">0</strong></div>
            <div>Skipped: <strong id="wp-skipped">0</strong></div>
        </section>

        <section id="controls">
            <button id="install-btn" class="btn" style="display: none; background-color: #28a745; color: white;">Install App</button>
            <button id="skip-wp-btn" class="btn">Skip</button>
            <button id="download-log-btn" class="btn">Log</button>
        </section>
        </div> <!-- End menu-content -->
    </aside>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/gpxparser"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.error('Service Worker Error', err));
            });
        }
    </script>
</body>
</html>
